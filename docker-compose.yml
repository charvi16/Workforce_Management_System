services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Wms@12345"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - wms-sqlserver-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  wms-sqlserver-data:
